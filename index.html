<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Tracker</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
  <div class="header-sub">LIFT TRACKER <span class="ver" id="verLabel"></span></div>
  <div class="header-title">e1RM Progress</div>
  <div class="header-stats" id="headerStats">0 total entries · 0 exercises tracked</div>
  <div class="profile-toggle">
    <span class="profile-label" id="label-home">HOME</span>
    <div class="toggle-track" id="profileToggle" onclick="toggleProfile()">
      <div class="toggle-thumb"></div>
    </div>
    <span class="profile-label" id="label-gym">GYM</span>
  </div>
  <div class="data-btns">
    <button class="data-btn" onclick="exportData()">EXPORT DATA</button>
    <button class="data-btn" onclick="document.getElementById('importFile').click()">IMPORT DATA</button>
    <button class="data-btn danger" onclick="clearAllData()">CLEAR ALL</button>
    <button class="data-btn" onclick="openSync()" id="syncBtn" style="border-color:rgba(46,204,113,0.35);color:rgba(46,204,113,0.8)">⇅ SYNC</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  <div class="data-btns" id="phaseRow"></div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchTab('log')" id="tab-log">LOG</button>
  <button class="nav-btn" onclick="switchTab('chart')" id="tab-chart">CHART</button>
  <button class="nav-btn" onclick="switchTab('stats')" id="tab-stats">STATS</button>
  <button class="nav-btn" onclick="switchTab('history')" id="tab-history">HISTORY</button>
</div>

<div class="content" id="content"></div>
<div class="formula">e1RM = weight × (1 + reps ÷ 30) · Epley Formula · Avg e1RM used for chart</div>

<div class="overlay" id="manageOverlay"><div class="ov-inner" id="manageInner"></div></div>
<div class="overlay" id="syncOverlay"><div class="ov-inner" id="syncInner"></div></div>
<div class="overlay" id="phaseOverlay"><div class="ov-inner" id="phaseInner"></div></div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/log.js"></script>
<script src="js/chart.js"></script>
<script src="js/stats.js"></script>
<script src="js/history.js"></script>
<script src="js/manage.js"></script>
<script src="js/phase.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
